<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚚 Delivery Route Optimizer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1c1c28;
      --border: #2a2a3a;
      --accent: #ff6b35;
      --accent2: #ffd166;
      --blue: #4ecdc4;
      --green: #06d6a0;
      --red: #ef476f;
      --purple: #9b5de5;
      --text: #f0f0f5;
      --muted: #7a7a9a;
      --font: 'Syne', sans-serif;
      --mono: 'DM Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── HEADER ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      z-index: 100;
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .logo-icon {
      width: 32px; height: 32px;
      background: var(--accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }

    .stats-bar {
      display: flex;
      gap: 20px;
    }

    .stat {
      text-align: center;
    }

    .stat-val {
      font-size: 20px;
      font-weight: 800;
      color: var(--accent);
      font-family: var(--mono);
    }

    .stat-label {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .conn-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
      font-family: var(--mono);
    }

    .conn-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--red);
      transition: background 0.3s;
    }

    .conn-dot.connected { background: var(--green); }

    /* ── MAIN LAYOUT ── */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 340px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    .sidebar-top {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .btn-optimize {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-optimize:hover { background: #ff8556; transform: translateY(-1px); }
    .btn-optimize:disabled { background: var(--border); color: var(--muted); transform: none; cursor: not-allowed; }

    .btn-add-order {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      background: transparent;
      color: var(--accent2);
      border: 1px solid var(--accent2);
      border-radius: 10px;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-add-order:hover { background: rgba(255,209,102,0.1); }

    .sidebar-section {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .sidebar-section::-webkit-scrollbar { width: 4px; }
    .sidebar-section::-webkit-scrollbar-track { background: transparent; }
    .sidebar-section::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .section-title {
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 10px;
      padding: 0 4px;
    }

    /* ── ORDER CARDS ── */
    .order-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }

    .order-card:hover { border-color: var(--accent); }
    .order-card.selected { border-color: var(--accent); background: rgba(255,107,53,0.08); }

    .order-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .order-id {
      font-size: 10px;
      font-family: var(--mono);
      color: var(--muted);
    }

    .order-delete {
      width: 20px; height: 20px;
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .order-delete:hover { background: rgba(239,71,111,0.2); color: var(--red); }

    .order-rest {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .order-items {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
      font-family: var(--mono);
    }

    .order-customer {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--blue);
    }

    /* ── ROUTE CARDS ── */
    .route-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .route-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .route-type-badge {
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      font-family: var(--mono);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-one_to_one    { background: rgba(78,205,196,0.15); color: var(--blue); border: 1px solid rgba(78,205,196,0.3); }
    .badge-one_to_many   { background: rgba(6,214,160,0.15);  color: var(--green); border: 1px solid rgba(6,214,160,0.3); }
    .badge-many_to_one   { background: rgba(155,93,229,0.15); color: var(--purple); border: 1px solid rgba(155,93,229,0.3); }
    .badge-many_to_many  { background: rgba(255,209,102,0.15); color: var(--accent2); border: 1px solid rgba(255,209,102,0.3); }

    .route-rider {
      font-size: 13px;
      font-weight: 700;
    }

    .route-meta {
      display: flex;
      gap: 12px;
      font-size: 11px;
      color: var(--muted);
      font-family: var(--mono);
    }

    .route-meta span { display: flex; align-items: center; gap: 4px; }

    .route-rest {
      font-size: 12px;
      color: var(--accent);
      margin-top: 6px;
      font-weight: 600;
    }

    .route-orders {
      margin-top: 8px;
    }

    .route-order-item {
      font-size: 11px;
      color: var(--muted);
      padding: 4px 0;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .route-order-item:first-child { border-top: none; }

    /* ── MAP ── */
    #map {
      flex: 1;
      z-index: 1;
    }

    /* ── MODAL ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 480px;
      max-height: 80vh;
      overflow-y: auto;
      padding: 24px;
      animation: modalIn 0.25s ease;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 20px;
    }

    .modal-tabs {
      display: flex;
      gap: 4px;
      background: var(--bg);
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 20px;
    }

    .modal-tab {
      flex: 1;
      padding: 8px;
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: var(--font);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .modal-tab.active {
      background: var(--surface2);
      color: var(--text);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .form-group { margin-bottom: 14px; }

    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      padding: 10px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus { border-color: var(--accent); }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      max-height: 200px;
      overflow-y: auto;
    }

    .quick-btn {
      padding: 8px 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--font);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
    }

    .quick-btn:hover { border-color: var(--accent); background: rgba(255,107,53,0.1); }
    .quick-btn.selected { border-color: var(--accent); background: rgba(255,107,53,0.15); color: var(--accent); }

    .quick-btn .sub { font-size: 10px; color: var(--muted); font-weight: 400; display: block; margin-top: 2px; }

    .suggestions {
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      margin-top: 4px;
    }

    .suggestion-item {
      padding: 10px 12px;
      font-size: 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }

    .suggestion-item:last-child { border-bottom: none; }
    .suggestion-item:hover { background: var(--surface2); }

    .modal-footer {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-cancel {
      flex: 1;
      padding: 11px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-family: var(--font);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-cancel:hover { border-color: var(--text); color: var(--text); }

    .btn-submit {
      flex: 2;
      padding: 11px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: white;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-submit:hover { background: #ff8556; }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      z-index: 2000;
      animation: toastIn 0.3s ease;
      max-width: 300px;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .empty-state {
      text-align: center;
      padding: 30px 20px;
      color: var(--muted);
    }

    .empty-state .icon { font-size: 32px; margin-bottom: 10px; }
    .empty-state p { font-size: 13px; line-height: 1.6; }

    /* Leaflet overrides */
    .leaflet-container { background: #0a0a14 !important; }
    .leaflet-tile { filter: brightness(0.7) saturate(0.8) hue-rotate(200deg); }

    .custom-marker {
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      font-size: 14px;
      font-weight: 800;
      border: 2px solid white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .legend {
      position: absolute;
      bottom: 24px;
      left: 350px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      z-index: 500;
      font-size: 11px;
    }

    .legend-title {
      font-weight: 700;
      margin-bottom: 8px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }

    .legend-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .optimizing-msg {
      background: rgba(255,209,102,0.1);
      border: 1px solid rgba(255,209,102,0.3);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      color: var(--accent2);
      margin-top: 8px;
      text-align: center;
      display: none;
    }

    .optimizing-msg.show { display: block; }

    /* ── STATUS BADGES ── */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      font-family: var(--mono);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-pending   { background: rgba(122,122,154,0.15); color: var(--muted); border: 1px solid rgba(122,122,154,0.3); }
    .status-picked_up { background: rgba(255,209,102,0.15); color: var(--accent2); border: 1px solid rgba(255,209,102,0.3); }
    .status-delivered { background: rgba(6,214,160,0.15);   color: var(--green);  border: 1px solid rgba(6,214,160,0.3); }

    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-pending   .status-dot { background: var(--muted); }
    .status-picked_up .status-dot { background: var(--accent2); animation: pulse 1s infinite; }
    .status-delivered .status-dot { background: var(--green); }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.7); }
    }

    /* ── ROUTE CARD ENHANCEMENTS ── */
    .route-progress {
      margin-top: 10px;
      background: var(--bg);
      border-radius: 6px;
      height: 4px;
      overflow: hidden;
    }

    .route-progress-bar {
      height: 100%;
      border-radius: 6px;
      transition: width 1s linear;
      background: var(--accent);
    }

    .route-eta {
      font-size: 11px;
      font-family: var(--mono);
      color: var(--accent2);
      margin-top: 6px;
    }

    .route-order-item .order-status {
      margin-left: auto;
    }

    /* ── RIDER ANIMATION ── */
    .rider-moving {
      animation: riderBounce 0.5s ease infinite alternate;
    }

    @keyframes riderBounce {
      from { transform: translateY(0); }
      to   { transform: translateY(-3px); }
    }

    /* ── DELIVERY COMPLETE BANNER ── */
    .delivery-complete {
      background: rgba(6,214,160,0.1);
      border: 1px solid rgba(6,214,160,0.3);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      color: var(--green);
      margin-top: 8px;
      text-align: center;
      display: none;
      font-weight: 600;
    }

    .delivery-complete.show { display: block; animation: slideIn 0.3s ease; }

    /* ── SIMULATE BTN ── */
    .btn-simulate {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      background: rgba(6,214,160,0.1);
      color: var(--green);
      border: 1px solid rgba(6,214,160,0.3);
      border-radius: 10px;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: none;
    }

    .btn-simulate.show { display: block; }
    .btn-simulate:hover { background: rgba(6,214,160,0.2); }

    /* ── ROUTE CARD FOCUS ── */
    .route-card.focused {
      border-color: var(--accent2) !important;
      background: rgba(255,209,102,0.06) !important;
      box-shadow: 0 0 0 2px rgba(255,209,102,0.2);
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">
    <div class="logo-icon">🚚</div>
    Route Optimizer
  </div>
  <div class="stats-bar">
    <div class="stat">
      <div class="stat-val" id="stat-orders">0</div>
      <div class="stat-label">Orders</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="stat-routes">0</div>
      <div class="stat-label">Routes</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="stat-riders">0</div>
      <div class="stat-label">Riders</div>
    </div>
  </div>
  <div class="conn-badge">
    <div class="conn-dot" id="conn-dot"></div>
    <span id="conn-text">Connecting...</span>
  </div>
</header>

<!-- MAIN -->
<div class="main">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-top">
      <button class="btn-optimize" id="btn-optimize" onclick="optimizeRoutes()">
        ⚡ OPTIMIZE ROUTES
      </button>
      <div class="optimizing-msg" id="optimizing-msg">🧠 Optimizing routes...</div>
      <div class="delivery-complete" id="delivery-complete">🎉 All deliveries complete!</div>
      <button class="btn-simulate" id="btn-simulate" onclick="startSimulation()">▶ Simulate Deliveries</button>
      <button class="btn-add-order" onclick="openModal()">+ Add Order</button>
    </div>

    <div class="sidebar-section" id="sidebar-content">
      <div class="section-title">Orders</div>
      <div id="orders-list">
        <div class="empty-state">
          <div class="icon">📦</div>
          <p>No orders yet.<br>Add orders to get started.</p>
        </div>
      </div>
      <div id="routes-section" style="display:none; margin-top:16px;">
        <div class="section-title">Routes</div>
        <div id="routes-list"></div>
      </div>
    </div>
  </div>

  <!-- MAP -->
  <div id="map"></div>

  <!-- LEGEND -->
  <div class="legend">
    <div class="legend-title">Route Types</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--blue)"></div> 1→1 One to One</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div> 1→N One to Many</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--purple)"></div> N→1 Many to One</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--accent2)"></div> N→N Many to Many</div>
  </div>
</div>

<!-- ADD ORDER MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-title">Add New Order</div>

    <div class="modal-tabs">
      <button class="modal-tab active" onclick="switchTab('quick')">⚡ Quick Pick</button>
      <button class="modal-tab" onclick="switchTab('search')">🔍 Search Address</button>
    </div>

    <!-- QUICK TAB -->
    <div class="tab-content active" id="tab-quick">
      <div class="form-group">
        <label class="form-label">Restaurant</label>
        <div class="quick-grid" id="rest-grid"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Menu Items</label>
        <input type="text" class="form-input" id="q-items" placeholder="e.g. Masala Dosa, Filter Coffee">
      </div>
      <div class="form-group">
        <label class="form-label">Customer</label>
        <div class="quick-grid" id="cust-grid"></div>
      </div>
    </div>

    <!-- SEARCH TAB -->
    <div class="tab-content" id="tab-search">
      <div class="form-group">
        <label class="form-label">Restaurant Name</label>
        <input type="text" class="form-input" id="s-rest-name" placeholder="e.g. MTR, Empire">
      </div>
      <div class="form-group">
        <label class="form-label">Restaurant Address</label>
        <input type="text" class="form-input" id="s-rest-addr" placeholder="Search Bengaluru address..." oninput="searchAddress(this,'rest-suggestions')">

// ── OPTIMIZE ─────────────────────────────────────────────────────────────────
function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2-lat1)*Math.PI/180;
  const dLng = (lng2-lng1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function autoAssignRiders(orderList) {
  const pool = RIDER_POOL.map(r => ({ ...r, load: 0 }));
  const assigned = {};

  const byRest = {};
  orderList.forEach((o, i) => {
    const key = o.restaurant.id || o.restaurant.name;
    if (!byRest[key]) byRest[key] = [];
    byRest[key].push(i);
  });

  const clusters = Object.values(byRest);
  clusters.forEach(clusterIdxs => {
    const anchor = orderList[clusterIdxs[0]];
    const best = pool.sort((a,b) => {
      const da = haversine(a.lat,a.lng,anchor.restaurant.lat,anchor.restaurant.lng) + a.load*2;
      const db = haversine(b.lat,b.lng,anchor.restaurant.lat,anchor.restaurant.lng) + b.load*2;
      return da-db;
    })[0];
    best.load += clusterIdxs.length;
    clusterIdxs.forEach(i => assigned[i] = best);
  });

  return { riders: Object.values(assigned).filter((v,i,a) => a.indexOf(v)===i), assigned };
}

async function optimizeRoutes() {
  if (!orders.length) { showToast('⚠️ Add at least one order first'); return; }

  const btn = document.getElementById('btn-optimize');
  const msg = document.getElementById('optimizing-msg');
  btn.disabled = true;
  btn.textContent = '⏳ Optimizing...';
  msg.classList.add('show');

  clearRouteLines();

  const { riders, assigned } = autoAssignRiders(orders);
  riders.forEach(r => addRiderMarker(r, true));

  try {
    const res = await fetch(`${BACKEND_URL}/api/orders`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ orders, deliveryPersons: riders }),
    });

    const routes = await res.json();
    currentRoutes = routes;
    simulationActive = false;
    simulationTimers.forEach(clearTimeout);
    simulationTimers = [];
    Object.values(riderMapMarkers).forEach(m => map.removeLayer(m));
    riderMapMarkers = {};
    renderRoutes(routes);
    focusedRouteIdx = null;
    await drawRouteLines(routes);
    updateStats(routes);
    document.getElementById('btn-simulate').style.display = 'block';
    document.getElementById('delivery-complete').classList.remove('show');
    showToast(`✅ ${routes.length} routes optimized!`);
  } catch (err) {
    showToast('❌ Backend error — is the server running?');
    console.error(err);
  }

  btn.disabled = false;
  btn.textContent = '⚡ OPTIMIZE ROUTES';
  msg.classList.remove('show');
}

// ── FOCUS ROUTE ON CLICK ─────────────────────────────────────────────────────
let focusedRouteIdx = null;

function focusRoute(ri) {
  // If clicking the already-focused card, unfocus and zoom back to all routes
  if (focusedRouteIdx === ri) {
    focusedRouteIdx = null;
    document.querySelectorAll('.route-card').forEach(c => c.classList.remove('focused'));
    // Dim all lines back to normal opacity
    routeLines.forEach(l => l.setStyle({ opacity: 0.8, weight: 4 }));
    // Zoom to fit all routes
    if (routeLines.length) {
      map.fitBounds(L.featureGroup(routeLines).getBounds().pad(0.1));
    }
    return;
  }

  focusedRouteIdx = ri;

  // Highlight selected card, dim others
  document.querySelectorAll('.route-card').forEach((c, i) => {
    c.classList.toggle('focused', i === ri);
  });

  // Dim all route lines, brighten the selected one
  routeLines.forEach((l, i) => {
    if (i === ri) {
      l.setStyle({ opacity: 1, weight: 6 });
    } else {
      l.setStyle({ opacity: 0.15, weight: 3 });
    }
  });

  // Zoom map to this route's bounds
  const geom = routeGeometries[ri];
  if (geom && geom.length) {
    const latlngs = geom.map(([lng, lat]) => [lat, lng]);
    map.fitBounds(L.polyline(latlngs).getBounds().pad(0.15));
  }
}

// ── DRAW ROUTE LINES ─────────────────────────────────────────────────────────
const routeGeometries = {};

async function drawRouteLines(routes) {
  for (let ri = 0; ri < routes.length; ri++) {
    const route = routes[ri];
    const pts = route.routePoints;
    if (!pts || pts.length < 2) continue;
    const color = ROUTE_COLORS[route.type] || '#ff6b35';
    try {
      const coords = pts.map(p => `${p.lng},${p.lat}`).join(';');
      const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson`);
      const data = await res.json();
      if (data.routes && data.routes[0]) {
        routeGeometries[ri] = data.routes[0].geometry.coordinates;
        const line = L.geoJSON(data.routes[0].geometry, {
          style: { color, weight: 4, opacity: 0.8, dashArray: route.type === 'one_to_one' ? null : '8,4' },
        }).addTo(map);
        routeLines.push(line);
      }
    } catch {
      const latlngs = pts.map(p => [p.lat, p.lng]);
      routeGeometries[ri] = latlngs.map(ll => [ll[1], ll[0]]);
      const line = L.polyline(latlngs, { color, weight: 3, opacity: 0.7, dashArray: '6,4' }).addTo(map);
      routeLines.push(line);
    }
  }
  if (routeLines.length) {
    const group = L.featureGroup(routeLines);
    map.fitBounds(group.getBounds().pad(0.1));
  }
}

// ── SIMULATION ────────────────────────────────────────────────────────────────
let simulationActive = false;
let simulationTimers = [];
let riderMapMarkers = {};
let currentRoutes = [];
let etaIntervals = [];

function startSimulation() {
  if (simulationActive) return;
  if (!currentRoutes.length) { showToast('⚠️ Optimize routes first'); return; }
  simulationActive = true;
  document.getElementById('btn-simulate').style.display = 'none';
  document.getElementById('delivery-complete').classList.remove('show');
  showToast('▶ Simulation started!');
  currentRoutes.forEach((route, ri) => {
    const totalMs = Math.max(route.estimatedTime * 800, 8000);
    animateRider(ri, route, totalMs);
  });
}

function animateRider(ri, route, totalMs) {
  const geom = routeGeometries[ri];
  if (!geom || geom.length < 2) return;

  const mkIcon = (emoji, bg) => L.divIcon({
    html: `<div style="width:34px;height:34px;background:${bg};border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;border:3px solid white;box-shadow:0 3px 10px rgba(0,0,0,0.5)">${emoji}</div>`,
    className: '', iconSize: [34,34], iconAnchor: [17,17],
  });

  // Place rider at start — status stays PENDING until they reach the restaurant
  const marker = L.marker([geom[0][1], geom[0][0]], { icon: mkIcon('🚴', '#ffd166'), zIndexOffset: 1000 })
    .addTo(map).bindPopup(`<b>${route.rider}</b>`);
  riderMapMarkers[`rider-${ri}`] = marker;

  // Explicitly set initial state to pending
  setRouteStatus(ri, 'pending');

  function closestIdx(lat, lng) {
    let best = 0, bestD = Infinity;
    geom.forEach(([gLng, gLat], i) => {
      const d = (gLat-lat)**2 + (gLng-lng)**2;
      if (d < bestD) { bestD = d; best = i; }
    });
    return best;
  }

  // ✅ FIX: Build per-order pickup and dropoff indices individually
  const orderMilestones = route.orders.map((o, oi) => ({
    oi,
    pickupIdx:  closestIdx(o.restaurant.lat, o.restaurant.lng),
    dropoffIdx: closestIdx(o.customer.lat,    o.customer.lng),
    pickedUp:   false,
    delivered:  false,
  }));

  // First pickup index across all orders (for route-level "En Route" trigger)
  const firstPickupIdx = Math.min(...orderMilestones.map(m => m.pickupIdx));

  const total  = geom.length;
  const stepMs = totalMs / total;

  // ETA countdown
  const etaEl = document.getElementById(`eta-${ri}`);
  let remaining = route.estimatedTime;
  const etaInt = setInterval(() => {
    remaining = Math.max(0, remaining - 1);
    if (etaEl) etaEl.textContent = remaining > 0 ? `⏱ ${remaining}m` : '⏱ Done';
    if (remaining === 0) clearInterval(etaInt);
  }, totalMs / Math.max(route.estimatedTime, 1));
  etaIntervals.push(etaInt);

  const progEl = document.getElementById(`prog-${ri}`);

  let idx = 0;
  const tick = setInterval(() => {
    if (idx >= total) {
      clearInterval(tick);
      finishRoute(ri, route, marker, mkIcon, progEl);
      return;
    }

    const [lng, lat] = geom[idx];
    marker.setLatLng([lat, lng]);
    if (progEl) progEl.style.width = Math.round((idx / (total-1)) * 100) + '%';

    // Route-level: switch to "En Route" when rider reaches the first restaurant
    if (idx === firstPickupIdx) {
      marker.setIcon(mkIcon('🚴', '#ff6b35'));
      setRouteStatus(ri, 'picked_up');
      showToast(`📦 ${route.rider} picking up from ${route.restaurants}`);
    }

    // ✅ FIX: Update each order individually when rider reaches its specific pickup/dropoff
    orderMilestones.forEach(m => {
      if (!m.pickedUp && idx >= m.pickupIdx) {
        m.pickedUp = true;
        setOrderStatus(ri, m.oi, 'picked_up');
      }
      if (!m.delivered && idx >= m.dropoffIdx) {
        m.delivered = true;
        setOrderStatus(ri, m.oi, 'delivered');
      }
    });

    idx++;
  }, stepMs);

  simulationTimers.push(tick);
}

function finishRoute(ri, route, marker, mkIcon, progEl) {
  const last = route.orders[route.orders.length - 1].customer;
  marker.setLatLng([last.lat, last.lng]);
  marker.setIcon(mkIcon('✅', '#06d6a0'));
  marker.bindPopup(`<b>${route.rider}</b><br>All delivered! 🎉`).openPopup();
  if (progEl) progEl.style.width = '100%';
  setRouteStatus(ri, 'delivered');
  route.orders.forEach((_, oi) => setOrderStatus(ri, oi, 'delivered'));
  const etaEl = document.getElementById(`eta-${ri}`);
  if (etaEl) etaEl.textContent = '⏱ Done';
  const card = document.getElementById(`rc-${ri}`);
  if (card) { card.style.borderColor = 'var(--green)'; card.style.background = 'rgba(6,214,160,0.05)'; }
  showToast(`✅ ${route.rider} completed all deliveries!`);

  setTimeout(() => {
    const allDone = currentRoutes.every((_, i) => {
      const bar = document.getElementById(`prog-${i}`);
      return bar && parseFloat(bar.style.width) >= 99;
    });
    if (allDone) {
      simulationActive = false;
      document.getElementById('delivery-complete').classList.add('show');
      updateStats(currentRoutes, true);
    }
  }, 600);
}

function setRouteStatus(ri, status) {
  const el = document.getElementById(`rider-status-${ri}`);
  if (!el) return;
  el.className = `status-badge status-${status}`;
  const labels = { pending: 'Pending', picked_up: 'En Route', delivered: 'Delivered' };
  el.innerHTML = `<span class="status-dot"></span>${labels[status]}`;
}

function setOrderStatus(ri, oi, status) {
  const el = document.getElementById(`os-${ri}-${oi}`);
  if (!el) return;
  el.className = `status-badge status-${status}`;
  const labels = { pending: 'Pending', picked_up: 'Picked Up', delivered: 'Delivered' };
  el.innerHTML = `<span class="status-dot"></span>${labels[status]}`;
}

// ── STATS ────────────────────────────────────────────────────────────────────
function updateStats(routes, allDelivered) {
  document.getElementById('stat-orders').textContent = orders.length;
  document.getElementById('stat-routes').textContent = routes ? routes.length : 0;
  document.getElementById('stat-riders').textContent = routes ? [...new Set(routes.map(r => r.rider))].length : 0;
  if (allDelivered) {
    document.getElementById('stat-orders').style.color = 'var(--green)';
    document.getElementById('stat-routes').style.color = 'var(--green)';
  }
}

// ── TOAST ────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  clearTimeout(toastTimer);
  let t = document.querySelector('.toast');
  if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.style.display = 'block';
  toastTimer = setTimeout(() => t.style.display = 'none', 3000);
}

// Close modal on overlay click
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});
</script>
