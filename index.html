<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚚 Delivery Route Optimizer</title>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
    .header { text-align: center; color: white; margin-bottom: 30px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
    .controls {
      background: rgba(255,255,255,0.95);
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      margin-bottom: 25px;
    }
    .btn {
      padding: 12px 24px; border: none; border-radius: 12px;
      font-weight: 600; cursor: pointer; transition: all 0.3s;
      margin: 5px; font-size: 15px;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
    .btn-primary { background: #4CAF50; color: white; }
    .btn-primary:hover:not(:disabled) { background: #45a049; transform: translateY(-2px); }
    .btn-secondary { background: #2196F3; color: white; }
    .btn-secondary:hover:not(:disabled) { background: #1976D2; transform: translateY(-2px); }
    .btn-outline { background: transparent; color: #667eea; border: 2px solid #667eea; }
    .btn-outline:hover { background: #667eea; color: white; transform: translateY(-2px); }
    .btn-danger { background: #f44336; color: white; }
    .btn-danger:hover { background: #d32f2f; transform: translateY(-2px); }
    .btn-optimize {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white; font-size: 16px; padding: 14px 32px;
      box-shadow: 0 4px 15px rgba(102,126,234,0.4);
    }
    .btn-optimize:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(102,126,234,0.5); }

    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 20px; }
    .stat-card { background: rgba(255,255,255,0.7); padding: 15px; border-radius: 15px; text-align: center; }

    .main-content { display: grid; grid-template-columns: 2fr 1fr; gap: 25px; }
    .map-container { background: rgba(255,255,255,0.95); border-radius: 20px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
    #map { height: 580px; width: 100%; }
    .routes-panel { background: rgba(255,255,255,0.95); border-radius: 20px; padding: 25px; max-height: 580px; overflow-y: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
    .route-card { color: white; padding: 18px; border-radius: 15px; margin-bottom: 12px; }

    /* Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.55); display: flex;
      align-items: center; justify-content: center;
      z-index: 9999; backdrop-filter: blur(4px);
    }
    .modal {
      background: white; border-radius: 20px; padding: 30px;
      width: 500px; max-width: 95vw;
      box-shadow: 0 30px 60px rgba(0,0,0,0.3);
      animation: popIn 0.2s ease;
    }
    @keyframes popIn {
      from { transform: scale(0.9); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
    .modal h3 { font-size: 1.3rem; margin-bottom: 20px; color: #333; border-bottom: 2px solid #667eea; padding-bottom: 10px; }

    /* Location picker section */
    .loc-section {
      border-radius: 14px; padding: 16px; margin-bottom: 14px;
      border-left: 4px solid #667eea; background: #f8f9ff;
    }
    .loc-section.customer { border-left-color: #4CAF50; background: #f6faf6; }
    .loc-section h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #666; margin-bottom: 12px; }

    /* Resolved chip */
    .resolved-chip {
      display: flex; align-items: center; justify-content: space-between;
      background: #e8f5e9; border: 1.5px solid #4CAF50;
      border-radius: 10px; padding: 10px 14px;
      font-size: 14px; color: #2e7d32; font-weight: 600;
    }
    .resolved-chip button {
      background: none; border: none; cursor: pointer;
      color: #f44336; font-size: 16px; padding: 0 0 0 10px;
    }

    /* Search box */
    .search-wrap { position: relative; }
    .search-input {
      width: 100%; padding: 10px 14px;
      border: 1.5px solid #ddd; border-radius: 10px;
      font-size: 14px; outline: none; transition: border-color 0.2s;
    }
    .search-input:focus { border-color: #667eea; }
    .dropdown {
      position: absolute; top: calc(100% + 2px); left: 0; right: 0;
      background: white; border: 1.5px solid #667eea;
      border-radius: 10px; z-index: 10000;
      max-height: 230px; overflow-y: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.13);
    }
    .drop-item {
      padding: 10px 14px; cursor: pointer;
      border-bottom: 1px solid #f0f0f0; transition: background 0.12s;
    }
    .drop-item:last-child { border-bottom: none; }
    .drop-item:hover { background: #f0f4ff; }
    .drop-item .d-name { font-weight: 600; font-size: 13px; color: #333; }
    .drop-item .d-sub  { font-size: 11px; color: #999; margin-top: 2px; }
    .drop-item.is-preset .d-name::before { content: '⚡ '; }
    .drop-searching { padding: 12px 14px; color: #999; font-size: 13px; font-style: italic; }

    /* Order list */
    .order-list { margin-top: 15px; max-height: 160px; overflow-y: auto; }
    .order-item {
      display: flex; align-items: center; justify-content: space-between;
      background: #f5f5f5; border-radius: 10px;
      padding: 9px 13px; margin-bottom: 7px; font-size: 13px;
    }
    .order-badge {
      font-size: 10px; font-weight: 700; padding: 2px 8px;
      border-radius: 20px; margin-left: 6px; color: white;
    }
    .delete-btn { background: none; border: none; cursor: pointer; font-size: 16px; color: #f44336; padding: 2px 6px; border-radius: 6px; }
    .delete-btn:hover { background: #fde8e8; }

    /* Stats bar */
    .stats-bar {
      background: linear-gradient(90deg, #667eea, #764ba2);
      color: white; border-radius: 12px; padding: 12px 20px;
      display: flex; gap: 24px; align-items: center;
      font-size: 14px; font-weight: 600; margin-top: 12px; flex-wrap: wrap;
    }

    /* Case legend */
    .case-legend {
      display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px;
    }
    .case-pill {
      padding: 4px 12px; border-radius: 20px; font-size: 12px;
      font-weight: 700; color: rgb(254, 252, 252);
    }

    .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
    .form-group label { font-size: 12px; color: #666; font-weight: 600; }
    .form-group input { padding: 9px 12px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
    .form-group input:focus { border-color: #2196F3; }

    @media (max-width: 768px) { .main-content { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
  const { useState, useEffect, useRef, useCallback } = React;

  // ── Bangalore location presets ────────────────────────────────────────────────
  const REST_PRESETS = [
    { name: "Truffles, Koramangala",           lat: 12.9352, lng: 77.6245 },
    { name: "Meghana Foods, Indiranagar",      lat: 12.9784, lng: 77.6408 },
    { name: "MTR Restaurant, Lalbagh",         lat: 12.9509, lng: 77.5848 },
    { name: "Empire Restaurant, MG Road",      lat: 12.9758, lng: 77.6095 },
    { name: "Vidyarthi Bhavan, Gandhi Bazaar", lat: 12.9432, lng: 77.5718 },
    { name: "Toit Brewpub, Indiranagar",       lat: 12.9792, lng: 77.6389 },
    { name: "The Only Place, Museum Road",     lat: 12.9716, lng: 77.5987 },
    { name: "Brahmin's Coffee Bar, Basavanagudi", lat: 12.9422, lng: 77.5730 },
  ];

  const CUST_PRESETS = [
    { name: "HSR Layout Sector 2",         lat: 12.9116, lng: 77.6389 },
    { name: "Whitefield ITPL Gate",        lat: 12.9836, lng: 77.7513 },
    { name: "Marathahalli Bridge",         lat: 12.9591, lng: 77.6974 },
    { name: "Yelahanka New Town",          lat: 13.1007, lng: 77.5963 },
    { name: "Electronic City Phase 1",     lat: 12.8399, lng: 77.6770 },
    { name: "Banashankari 3rd Stage",      lat: 12.9253, lng: 77.5484 },
    { name: "Hebbal Flyover",              lat: 13.0350, lng: 77.5970 },
    { name: "JP Nagar 6th Phase",          lat: 12.9063, lng: 77.5857 },
  ];

  // ── Demo data — covers all 4 cases ──────────────────────────────────────────
  //
  //  CASE 1:1  →  Toit Indiranagar  → customer in Indiranagar     (Priya)
  //  CASE 1:N  →  MTR Lalbagh       → 3 customers Jayanagar area  (Karthik)
  //  CASE N:1  →  3 Koramangala restaurants → same HSR customer   (Arjun)
  //  CASE N:N  →  2 Whitefield restaurants  → 2 Marathahalli cust (Meera)
  //
  const DEMO_ORDERS = [
    // 1:1 ─────────────────────────────────────────────────────────────────────
    {
      id: 2001,
      restaurant: { id: 'r2001', name: "Toit Brewpub, Indiranagar", lat: 12.9792, lng: 77.6389 },
      customer:   {              name: "Ravi Kumar, Indiranagar",   lat: 12.9760, lng: 77.6420 },
      caseType: '1:1'
    },
    // 1:N ─────────────────────────────────────────────────────────────────────
    {
      id: 2002,
      restaurant: { id: 'r2002', name: "MTR Restaurant, Lalbagh", lat: 12.9509, lng: 77.5848 },
      customer:   {              name: "Sneha, Banashankari",      lat: 12.9253, lng: 77.5484 },
      caseType: '1:N'
    },
    {
      id: 2003,
      restaurant: { id: 'r2002', name: "MTR Restaurant, Lalbagh", lat: 12.9509, lng: 77.5848 },
      customer:   {              name: "Amit, JP Nagar",           lat: 12.9063, lng: 77.5857 },
      caseType: '1:N'
    },
    {
      id: 2004,
      restaurant: { id: 'r2002', name: "MTR Restaurant, Lalbagh", lat: 12.9509, lng: 77.5848 },
      customer:   {              name: "Divya, Vidyapeeth",        lat: 12.9350, lng: 77.5620 },
      caseType: '1:N'
    },
    // N:1 ─────────────────────────────────────────────────────────────────────
    {
      id: 2005,
      restaurant: { id: 'r2005', name: "Truffles, Koramangala",   lat: 12.9352, lng: 77.6245 },
      customer:   {              name: "Preethi, HSR Layout",      lat: 12.9116, lng: 77.6389 },
      caseType: 'N:1'
    },
    {
      id: 2006,
      restaurant: { id: 'r2006', name: "The Permit Room, Koramangala", lat: 12.9340, lng: 77.6270 },
      customer:   {              name: "Preethi, HSR Layout",      lat: 12.9116, lng: 77.6389 },
      caseType: 'N:1'
    },
    {
      id: 2007,
      restaurant: { id: 'r2007', name: "Sotally Tober, Koramangala",  lat: 12.9330, lng: 77.6255 },
      customer:   {              name: "Preethi, HSR Layout",      lat: 12.9116, lng: 77.6389 },
      caseType: 'N:1'
    },
    // N:N ─────────────────────────────────────────────────────────────────────
    {
      id: 2008,
      restaurant: { id: 'r2008', name: "Café Azzure, Whitefield",  lat: 12.9698, lng: 77.7499 },
      customer:   {              name: "Kiran, Marathahalli",       lat: 12.9591, lng: 77.6974 },
      caseType: 'N:N'
    },
    {
      id: 2009,
      restaurant: { id: 'r2009', name: "Mainland China, Whitefield", lat: 12.9720, lng: 77.7510 },
      customer:   {              name: "Ananya, Marathahalli",      lat: 12.9610, lng: 77.6990 },
      caseType: 'N:N'
    },
  ];

  const DEMO_RIDERS = [
    { id: 'rd1', name: 'Arjun',   lat: 12.9340, lng: 77.6260 }, // near Koramangala (N:1)
    { id: 'rd2', name: 'Priya',   lat: 12.9800, lng: 77.6400 }, // near Indiranagar (1:1)
    { id: 'rd3', name: 'Karthik', lat: 12.9520, lng: 77.5840 }, // near Lalbagh (1:N)
    { id: 'rd4', name: 'Meera',   lat: 12.9710, lng: 77.7500 }, // near Whitefield (N:N)
  ];

  // ── LocationSearch ────────────────────────────────────────────────────────────
  function LocationSearch({ label, emoji, presets, onSelect, accentColor = '#667eea' }) {
    const [query, setQuery]       = useState('');
    const [results, setResults]   = useState([]);
    const [loading, setLoading]   = useState(false);
    const [resolved, setResolved] = useState(null);
    const [open, setOpen]         = useState(false);
    const debounce                = useRef(null);
    const wrapRef                 = useRef(null);

    useEffect(() => {
      const close = (e) => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
      document.addEventListener('mousedown', close);
      return () => document.removeEventListener('mousedown', close);
    }, []);

    const onType = (val) => {
      setQuery(val); setOpen(true);
      if (debounce.current) clearTimeout(debounce.current);
      if (val.length < 3) { setResults([]); setLoading(false); return; }
      setLoading(true);
      debounce.current = setTimeout(async () => {
        try {
          const r = await fetch(
            `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(val + ' Bangalore')}&format=json&limit=5`,
            { headers: { 'Accept-Language': 'en' } }
          );
          const d = await r.json();
          setResults(d.map(x => ({
            name: x.display_name.split(',').slice(0, 2).join(',').trim(),
            full: x.display_name,
            lat: parseFloat(x.lat),
            lng: parseFloat(x.lon),
          })));
        } catch { setResults([]); }
        setLoading(false);
      }, 350);
    };

    const pick = (item) => {
      setResolved(item); setQuery(''); setOpen(false); setResults([]);
      onSelect(item);
    };
    const clear = () => { setResolved(null); onSelect(null); };

    const visiblePresets = presets.filter(p =>
      query.length === 0 || p.name.toLowerCase().includes(query.toLowerCase())
    );

    if (resolved) return (
      <div className="resolved-chip">
        <span>{emoji} {resolved.name}</span>
        <button onClick={clear} title="Change">✕</button>
      </div>
    );

    return (
      <div className="search-wrap" ref={wrapRef}>
        <input
          className="search-input"
          type="text"
          placeholder={`Search ${label} location…`}
          value={query}
          onChange={e => onType(e.target.value)}
          onFocus={() => setOpen(true)}
          style={{ borderColor: open ? accentColor : '#ddd' }}
        />
        {open && (
          <div className="dropdown">
            {visiblePresets.map((p, i) => (
              <div key={`p${i}`} className="drop-item is-preset" onMouseDown={() => pick(p)}>
                <div className="d-name">{p.name}</div>
                <div className="d-sub">Quick pick · Bangalore</div>
              </div>
            ))}
            {visiblePresets.length > 0 && (results.length > 0 || loading) &&
              <div style={{ borderTop: '1px solid #eee' }} />}
            {loading && <div className="drop-searching">🔍 Searching…</div>}
            {!loading && results.map((r, i) => (
              <div key={`r${i}`} className="drop-item" onMouseDown={() => pick(r)}>
                <div className="d-name">{r.name}</div>
                <div className="d-sub">{r.full}</div>
              </div>
            ))}
            {!loading && query.length >= 3 && results.length === 0 && visiblePresets.length === 0 &&
              <div className="drop-searching">No results found</div>}
          </div>
        )}
      </div>
    );
  }

  // ── App ───────────────────────────────────────────────────────────────────────
  function App() {
    const [orders, setOrders]             = useState(DEMO_ORDERS);
    const [riders, setRiders]             = useState(DEMO_RIDERS);
    const [routes, setRoutes]             = useState([]);
    const [showOrderModal, setShowOrder]  = useState(false);
    const [showRiderModal, setShowRider]  = useState(false);
    const [formError, setFormError]       = useState('');
    const [routeStats, setRouteStats]     = useState(null);
    const [optimizing, setOptimizing]     = useState(false);

    // order form
    const [restLoc, setRestLoc] = useState(null);
    const [custLoc, setCustLoc] = useState(null);
    // rider form
    const [riderName, setRiderName] = useState('');
    const [riderLoc, setRiderLoc]   = useState(null);

    const mapRef    = useRef(null);
    const socketRef = useRef(null);
    const CENTER    = [12.9716, 77.5946];

    // Init map
    useEffect(() => {
      if (mapRef.current) return;
      const map = L.map('map').setView(CENTER, 12);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '© OpenStreetMap © CartoDB', maxZoom: 19
      }).addTo(map);
      mapRef.current = map;
    }, []);

    // Socket
    useEffect(() => {
      try {
        socketRef.current = io('http://localhost:5500');
        socketRef.current.on('routes_updated', setRoutes);
      } catch(e) {}
      return () => socketRef.current?.disconnect();
    }, []);

    const addMarker = (lat, lng, html) => {
      if (!mapRef.current) return;
      L.marker([lat, lng], {
        icon: L.divIcon({ html, className: '', iconSize: [30, 30], iconAnchor: [15, 15] })
      }).addTo(mapRef.current);
    };

    // ── Submit order ──
    const submitOrder = () => {
      if (!restLoc) { setFormError('Please select a restaurant location.'); return; }
      if (!custLoc) { setFormError('Please select a customer location.'); return; }
      const o = {
        id: Date.now(),
        restaurant: { id: `r${Date.now()}`, name: restLoc.name, lat: restLoc.lat, lng: restLoc.lng },
        customer:   { name: custLoc.name, lat: custLoc.lat, lng: custLoc.lng },
      };
      setOrders(p => [...p, o]);
      addMarker(restLoc.lat, restLoc.lng, '🏪');
      addMarker(custLoc.lat, custLoc.lng, '📱');
      setRestLoc(null); setCustLoc(null); setFormError(''); setShowOrder(false);
    };

    // ── Submit rider ──
    const submitRider = () => {
      if (!riderName.trim()) { setFormError('Enter rider name.'); return; }
      if (!riderLoc)         { setFormError('Select rider location.'); return; }
      const r = { id: `rd${Date.now()}`, name: riderName.trim(), lat: riderLoc.lat, lng: riderLoc.lng };
      setRiders(p => [...p, r]);
      addMarker(riderLoc.lat, riderLoc.lng, '🚴');
      setRiderName(''); setRiderLoc(null); setFormError(''); setShowRider(false);
    };

    const addRandomRider = () => {
      const r = {
        id: `rd${Date.now()}`,
        name: `Rider ${riders.length + 1}`,
        lat: CENTER[0] + (Math.random() - 0.5) * 0.09,
        lng: CENTER[1] + (Math.random() - 0.5) * 0.09,
      };
      setRiders(p => [...p, r]);
      addMarker(r.lat, r.lng, '🚴');
      setShowRider(false);
    };

    const deleteOrder = (id) => setOrders(p => p.filter(o => o.id !== id));
    const clearAll    = () => { setOrders([]); setRiders([]); setRoutes([]); setRouteStats(null); };
    const loadDemo    = () => { setOrders(DEMO_ORDERS); setRiders(DEMO_RIDERS); setRoutes([]); setRouteStats(null); };

    // ── Optimize ──
    const optimizeRoutes = async () => {
      setOptimizing(true);
      try {
        const res  = await fetch('http://localhost:5500/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ orders, deliveryPersons: riders })
        });
        const data = await res.json();
        setRoutes(data);

        if (mapRef.current) {
          mapRef.current.eachLayer(l => { if (!(l instanceof L.TileLayer)) mapRef.current.removeLayer(l); });

          const palette = ['#e74c3c','#3498db','#f39c12','#9b59b6','#1abc9c','#e67e22'];
          const riderColors = {};
          let ci = 0, totalKm = 0;

          for (const route of data) {
            if (!riderColors[route.rider]) { riderColors[route.rider] = palette[ci++ % palette.length]; }
            const color = riderColors[route.rider];
            if (route.estimatedDistance) totalKm += parseFloat(route.estimatedDistance) || 0;

            if (route.routePoints?.length > 1) {
              const coords = route.routePoints.map(p => `${p.lng},${p.lat}`).join(';');
              try {
                const or = await fetch(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson`);
                const od = await or.json();
                if (od.routes?.[0]) {
                  const rc = od.routes[0].geometry.coordinates.map(([ln, la]) => [la, ln]);
                  L.polyline(rc, { color: 'rgba(0,0,0,0.18)', weight: 10, opacity: 1 }).addTo(mapRef.current);
                  L.polyline(rc, {
                    color, weight: 6, opacity: 0.95,
                    lineJoin: 'round', lineCap: 'round',
                    dashArray: route.type === 'one_to_one' ? null : '10,6'
                  }).addTo(mapRef.current);
                }
              } catch {
                L.polyline(route.routePoints.map(p => [p.lat, p.lng]), { color, weight: 6 }).addTo(mapRef.current);
              }

              // Pickup markers
              route.routePoints.filter(p => p.type === 'pickup').forEach(p => {
                L.marker([p.lat, p.lng], { icon: L.divIcon({
                  html: `<div style="background:${color};width:32px;height:32px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.4)"><div style="transform:rotate(45deg);text-align:center;line-height:26px;font-size:14px">🏪</div></div>`,
                  className:'', iconSize:[32,32], iconAnchor:[16,32]
                })}).bindPopup(`<b>🏪 ${p.name}</b><br>Pickup — <b>${route.rider}</b>`).addTo(mapRef.current);
              });

              // Dropoff markers
              route.routePoints.filter(p => p.type === 'dropoff').forEach(p => {
                L.marker([p.lat, p.lng], { icon: L.divIcon({
                  html: `<div style="background:white;width:28px;height:28px;border-radius:50%;border:3px solid ${color};box-shadow:0 2px 8px rgba(0,0,0,0.4);text-align:center;line-height:22px;font-size:14px">📱</div>`,
                  className:'', iconSize:[28,28], iconAnchor:[14,14]
                })}).bindPopup(`<b>📱 ${p.name}</b><br>Dropoff — <b>${route.rider}</b>`).addTo(mapRef.current);
              });

              // Rider start marker
              if (route.riderStart) {
                L.marker([route.riderStart.lat, route.riderStart.lng], { icon: L.divIcon({
                  html: `<div style="background:#333;color:white;width:34px;height:34px;border-radius:50%;border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.4);text-align:center;line-height:28px;font-size:16px">🚴</div>`,
                  className:'', iconSize:[34,34], iconAnchor:[17,17]
                })}).bindPopup(`<b>🚴 ${route.rider}</b><br>Starting point`).addTo(mapRef.current);
              }
            }
          }

          const allPts = data.flatMap(r => r.routePoints?.map(p => [p.lat, p.lng]) || []);
          if (allPts.length > 0) mapRef.current.fitBounds(allPts, { padding: [50, 50] });

          setRouteStats({
            riders: [...new Set(data.map(r => r.rider))].length,
            orders: orders.length,
            routes: data.length,
            km: totalKm.toFixed(1)
          });
        }
      } catch (err) {
        alert('🚨 Start backend first!\n\nRun: cd backend && npm start');
        console.error(err);
      }
      setOptimizing(false);
    };

    const casePillColor = (type) => ({
      one_to_one: '#2196F3', one_to_many: '#FF9800',
      many_to_one: '#9C27B0', many_to_many: '#4CAF50'
    }[type] || '#888');

    return (
      <div className="container">

        {/* ── Order Modal ── */}
        {showOrderModal && (
          <div className="modal-overlay" onClick={() => { setShowOrder(false); setFormError(''); setRestLoc(null); setCustLoc(null); }}>
            <div className="modal" onClick={e => e.stopPropagation()}>
              <h3>📦 Add New Order</h3>

              <div className="loc-section">
                <h4>🏪 Restaurant Location</h4>
                <LocationSearch label="restaurant" emoji="🏪" presets={REST_PRESETS} onSelect={setRestLoc} accentColor="#667eea" />
              </div>

              <div className="loc-section customer">
                <h4>📱 Customer Location</h4>
                <LocationSearch label="customer" emoji="📱" presets={CUST_PRESETS} onSelect={setCustLoc} accentColor="#4CAF50" />
              </div>

              {formError && <div style={{ color:'#f44336', fontSize:13, marginBottom:8 }}>⚠️ {formError}</div>}

              <div className="form-actions">
                <button className="btn btn-outline" onClick={() => { setShowOrder(false); setFormError(''); setRestLoc(null); setCustLoc(null); }}>Cancel</button>
                <button className="btn btn-primary" onClick={submitOrder} disabled={!restLoc || !custLoc}>Add Order ✓</button>
              </div>
            </div>
          </div>
        )}

        {/* ── Rider Modal ── */}
        {showRiderModal && (
          <div className="modal-overlay" onClick={() => { setShowRider(false); setFormError(''); setRiderName(''); setRiderLoc(null); }}>
            <div className="modal" style={{ width: 420 }} onClick={e => e.stopPropagation()}>
              <h3>🚴 Add Delivery Rider</h3>
              <div className="loc-section">
                <h4>Rider Details</h4>
                <div className="form-group">
                  <label>Rider Name</label>
                  <input type="text" placeholder="e.g. Arjun" value={riderName} onChange={e => setRiderName(e.target.value)} />
                </div>
                <h4 style={{ marginBottom: 8 }}>📍 Starting Location</h4>
                <LocationSearch label="location" emoji="📍" presets={[...REST_PRESETS, ...CUST_PRESETS].slice(0,6)} onSelect={setRiderLoc} accentColor="#2196F3" />
              </div>

              {formError && <div style={{ color:'#f44336', fontSize:13, marginBottom:8 }}>⚠️ {formError}</div>}

              <div className="form-actions">
                <button className="btn btn-outline" onClick={() => { setShowRider(false); setFormError(''); setRiderName(''); setRiderLoc(null); }}>Cancel</button>
                <button className="btn btn-secondary" onClick={addRandomRider}>🎲 Random</button>
                <button className="btn btn-primary" onClick={submitRider}>Add Rider ✓</button>
              </div>
            </div>
          </div>
        )}

        {/* ── Header ── */}
        <div className="header">
          <h1 style={{ fontSize: '2rem' }}>🚚 Smart Delivery Route Optimizer</h1>
          <p style={{ marginTop: 6, opacity: 0.9 }}>Supports all 4 cases · 1:1 &nbsp;·&nbsp; 1:N &nbsp;·&nbsp; N:1 &nbsp;·&nbsp; N:N</p>
        </div>

        {/* ── Controls ── */}
        <div className="controls">
          <div style={{ display:'flex', gap:'10px', flexWrap:'wrap', justifyContent:'center' }}>
            <button className="btn btn-primary"   onClick={() => { setShowOrder(true); setFormError(''); }}>+ Add Order ({orders.length})</button>
            <button className="btn btn-secondary" onClick={() => { setShowRider(true); setFormError(''); }}>+ Add Rider ({riders.length})</button>
            <button className="btn btn-optimize"  onClick={optimizeRoutes} disabled={orders.length === 0 || riders.length === 0 || optimizing}>
              {optimizing ? '⏳ Optimizing…' : '🧠 OPTIMIZE ROUTES'}
            </button>
            <button className="btn btn-outline"   onClick={loadDemo}>🔄 Load Demo</button>
            <button className="btn btn-danger"    onClick={clearAll}>🗑 Clear All</button>
          </div>

          {/* Stats bar after optimize */}
          {routeStats && (
            <div className="stats-bar">
              <span>🚴 <strong>{routeStats.riders}</strong> riders active</span>
              <span>📦 <strong>{routeStats.orders}</strong> orders</span>
              <span>🛣️ <strong>{routeStats.routes}</strong> routes</span>
              <span>📏 <strong>{routeStats.km} km</strong> total</span>
            </div>
          )}

          {/* Order list */}
          {orders.length > 0 && (
            <div className="order-list">
              {orders.map(o => (
                <div key={o.id} className="order-item">
                  <div style={{ flex: 1, fontSize: 13 }}>
                    🏪 <strong>{o.restaurant.name}</strong>
                    <span style={{ color:'#888', marginLeft: 6 }}>→ 📱 {o.customer.name}</span>
                    {o.caseType && (
                      <span className="order-badge" style={{ background: o.caseType === '1:1' ? '#2196F3' : o.caseType === '1:N' ? '#FF9800' : o.caseType === 'N:1' ? '#9C27B0' : '#4CAF50' }}>
                        {o.caseType}
                      </span>
                    )}
                  </div>
                  <button className="delete-btn" onClick={() => deleteOrder(o.id)}>✕</button>
                </div>
              ))}
            </div>
          )}

          <div className="stats">
            <div className="stat-card"><div style={{ fontSize:'2rem', marginBottom:8 }}>📦</div><div style={{ fontSize:'1.5rem', fontWeight:'bold' }}>{orders.length}</div><div>Orders</div></div>
            <div className="stat-card"><div style={{ fontSize:'2rem', marginBottom:8 }}>🚴</div><div style={{ fontSize:'1.5rem', fontWeight:'bold' }}>{riders.length}</div><div>Riders</div></div>
            <div className="stat-card"><div style={{ fontSize:'2rem', marginBottom:8 }}>🛣️</div><div style={{ fontSize:'1.5rem', fontWeight:'bold' }}>{routes.length}</div><div>Routes</div></div>
            <div className="stat-card"><div style={{ fontSize:'2rem', marginBottom:8 }}>🎯</div><div style={{ fontSize:'1.5rem', fontWeight:'bold' }}>{[...new Set(['1:1','1:N','N:1','N:N'].filter(c => DEMO_ORDERS.some(o => o.caseType === c && orders.find(x => x.id === o.id))))].length || '4'}</div><div>Cases</div></div>
          </div>
        </div>

        {/* ── Map + Panel ── */}
        <div className="main-content">
          <div className="map-container"><div id="map"></div></div>

          <div className="routes-panel">
            <h2 style={{ marginBottom:12, color:'#333', textAlign:'center' }}>📊 Optimized Routes</h2>

            {routes.length > 0 && (
              <div style={{ marginBottom:15, padding:12, background:'#f5f5f5', borderRadius:10, fontSize:13 }}>
                <b>🗺️ Rider Colors</b><br/>
                {[...new Set(routes.map(r => r.rider))].map((rider, i) => (
                  <span key={rider} style={{ marginRight:12, display:'inline-flex', alignItems:'center', gap:4 }}>
                    <span style={{ display:'inline-block', width:12, height:12, borderRadius:'50%', background:['#e74c3c','#3498db','#f39c12','#9b59b6','#1abc9c','#e67e22'][i%6] }}></span>
                    {rider}
                  </span>
                ))}
                <div style={{ marginTop:8, color:'#888' }}>Solid = 1:1 &nbsp;|&nbsp; Dashed = multi-order</div>
              </div>
            )}

            {routes.length === 0 ? (
              <div style={{ textAlign:'center', color:'#666', padding:'30px 20px' }}>
                <div style={{ fontSize:'3.5rem', marginBottom:16 }}>🎯</div>
                <h3 style={{ marginBottom:8 }}>Demo data loaded!</h3>
                <p style={{ fontSize:13, color:'#999', lineHeight:1.6 }}>
                  <b>9 orders · 4 riders</b> across Bangalore<br/>
                  covering all 4 optimization cases.<br/><br/>
                  Click <b>OPTIMIZE ROUTES</b> to see them on the map.
                </p>
                <div className="case-legend" style={{ justifyContent:'center', marginTop:14 }}>
                  {[['1:1','#2196F3'],['1:N','#FF9800'],['N:1','#9C27B0'],['N:N','#4CAF50']].map(([c,col]) => (
                    <span key={c} className="case-pill" style={{ background:col }}>{c}</span>
                  ))}
                </div>
              </div>
            ) : routes.map((route, i) => (
              <div key={i} className="route-card" style={{ background: `linear-gradient(135deg, ${['#e74c3c','#3498db','#f39c12','#9b59b6','#1abc9c','#e67e22'][i%6]}, ${['#c0392b','#2980b9','#e67e22','#8e44ad','#16a085','#ca6f1e'][i%6]})` }}>
                <div style={{ fontSize:'1.1rem', marginBottom:10, display:'flex', alignItems:'center', gap:8 }}>
                  <span>Route #{i + 1}</span>
                  <span style={{ background:'rgba(255,255,255,0.25)', padding:'2px 10px', borderRadius:20, fontSize:11, fontWeight:700 }}>
                    {route.type?.replace(/_/g, ':').toUpperCase()}
                  </span>
                </div>
                <div style={{ fontSize:'0.95rem', lineHeight:1.8 }}>
                  <div>🚴 Rider: <strong>{route.rider}</strong></div>
                  <div>🏪 Restaurants: <strong>{route.restaurants}</strong></div>
                  <div>📦 Orders: <strong>{route.orders?.length || 0}</strong></div>
                  <div>⏱️ Time: <strong>{route.estimatedTime} mins</strong></div>
                  <div>📏 Distance: <strong>{route.estimatedDistance} km</strong></div>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
